# SearXNG —— Apache 反代配置（加固版，供 qqbot 的 web:search 工具调用）
#
# 与 zfile/alist 的网络模式一致：服务只监听本机（uwsgi unix socket），
# 反向代理仅对【本机 + Tailscale 网段】放行，不对公网/LAN 开放。
# SearXNG 是无鉴权元搜索，公网裸奔会被白嫖刷流量甚至当开放代理，切勿 Allow from all。
#
# 适用部署形态（qqbot/.env.prod 的 AI_SEARXNG_URL 对应写法）：
#   A. bot 与 SearXNG 同机（本机/WSL/云服务器单机）
#        AI_SEARXNG_URL=http://127.0.0.1/searxng        ← Require local 放行
#   B. bot 在云服务器，SearXNG 留在家里，经 Tailscale 互访
#        AI_SEARXNG_URL=http://<家里机器的 100.x Tailscale IP>/searxng
#        （下方 100.64.0.0/10 即 Tailscale CGNAT 网段，自动放行）
#   C. 云上同机但需要从自己电脑浏览器调试：临时把本机 Tailscale IP 加入 Require ip。
#
# 安装（需要 sudo；本机现有配置直接位于 sites-enabled，替换它即可）：
#   sudo cp /etc/apache2/sites-enabled/searxng.conf{,.bak}
#   sudo cp deploy/searxng-apache.conf /etc/apache2/sites-enabled/searxng.conf
#   sudo a2enmod proxy proxy_uwsgi headers && sudo apache2ctl configtest
#   sudo systemctl reload apache2
#   # 验证：127.0.0.1 与 Tailscale IP 应 200；WSL/LAN IP（172.x/192.168.x）应 403
#   curl -s -o /dev/null -w "%{http_code}\n" http://127.0.0.1/searxng/
#
# 云服务器补充：安全组不要放行 80 端口给 0.0.0.0/0 的 /searxng（同机 bot 走 localhost
# 不受影响）；若确需对公网提供页面，在 /etc/searxng/settings.yml 设
# server.limiter: true 并配置 redis，而不是靠本配置放开来源。

LoadModule ssl_module           /usr/lib/apache2/modules/mod_ssl.so
LoadModule headers_module       /usr/lib/apache2/modules/mod_headers.so
LoadModule proxy_module         /usr/lib/apache2/modules/mod_proxy.so
LoadModule proxy_uwsgi_module   /usr/lib/apache2/modules/mod_proxy_uwsgi.so

<Location /searxng>
    # 仅允许：本机回环 + Tailscale 网段（多条 Require 默认任一满足即放行）
    Require local
    Require ip 100.64.0.0/10
    Require ip fd7a:115c:a1e0::/48

    # 补尾部斜杠
    RedirectMatch 308 /searxng$ /searxng/

    ProxyPreserveHost On
    ProxyPass unix:/usr/local/searxng/run/socket|uwsgi://uwsgi-uds-searxng/

    # see flaskfix.py
    RequestHeader set X-Forwarded-Proto %{REQUEST_SCHEME}s
    RequestHeader set X-Script-Name /searxng

    # see botdetection/trusted_proxies.py
    RequestHeader set X-Real-IP %{REMOTE_ADDR}s
    RequestHeader append X-Forwarded-For %{REMOTE_ADDR}s
</Location>
