# 群资源站 —— nginx 配置（可选方案）
# 适用于：前端 build 后纯静态部署，不需要 Vite preview
#
# 部署方式：
#   1. cd frontend && npm run build
#   2. 将此配置放到 /etc/nginx/sites-available/grouphub
#   3. 修改 root 路径和 proxy_pass 地址
#   4. ln -s /etc/nginx/sites-available/grouphub /etc/nginx/sites-enabled/
#   5. nginx -t && systemctl reload nginx
#
# 注意：使用此方案时，前端 .env 的 VITE_API_BASE 需改为完整后端地址
#       （如 http://127.0.0.1:8003），而不是 /api

server {
    listen 80;
    server_name _;  # 改成你的域名或 Tailscale 地址

    # 前端静态文件
    root /home/jianying/code/grouphub/frontend/dist;
    index index.html;

    # API 反向代理 → backend
    location /api/ {
        proxy_pass http://127.0.0.1:8003/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 上传大文件支持
        proxy_read_timeout 300s;
        client_max_body_size 500m;
    }

    # zfile 反向代理
    location /zfile/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        client_max_body_size 500m;
    }

    # alist 反向代理
    location /alist/ {
        proxy_pass http://127.0.0.1:5244/;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        client_max_body_size 500m;
    }

    # SPA 路由 fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
